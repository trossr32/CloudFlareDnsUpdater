version: '3.4'

services:
  cloudflarednsupdater:
    image: ghcr.io/trossr32/cloudflare-dns-updater
    container_name: cloudflarednsupdater
    build:
      context: .
      dockerfile: CloudFlareDnsUpdater/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

      # CloudFlare settings, use either Email and ApiKey or ApiToken
      - CloudFlare__Email=
      - CloudFlare__ApiKey=
      - CloudFlare__ApiToken=
      
      - UpdateIntervalSeconds=
      - LimitToZoneByDomain=
      # Comma-separated record names that must never be updated, e.g. a LAN-only host:
      #   ExcludeRecords=calitally.example.com,nas.example.com
      - ExcludeRecords=
      # Records whose current address is private (10/8, 172.16/12, 192.168/16, ...) are left alone by default.
      - SkipPrivateIpRecords=true
    restart: unless-stopped

