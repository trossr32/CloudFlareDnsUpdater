name: Build docker image
on:
  push:
    branches: [ master ]
  
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      name: Check out code

    - uses: mr-smithers-excellent/docker-build-push@v7
      name: Build & push Docker image
      with:
        image: trossr32/cloudflare-dns-updater
        tags: latest
        registry: ghcr.io
        dockerfile: CloudFlareDnsUpdater/Dockerfile
        username: trossr32
        password: ${{ secrets.REPOSNAPSHOT_API_KEY }}